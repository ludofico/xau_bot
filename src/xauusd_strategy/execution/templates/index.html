
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Bot Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #2d2d2d; border: 1px solid #404040; margin-bottom: 20px; }
        .card-header { border-bottom: 1px solid #404040; background-color: #333; font-weight: bold; }
        .metric-value { font-size: 2em; font-weight: bold; }
        .metric-label { color: #888; font-size: 0.9em; }
        .text-success { color: #4caf50 !important; }
        .text-danger { color: #f44336 !important; }
        .btn-stop { width: 100%; height: 50px; font-size: 1.2em; font-weight: bold; }
        table { color: #e0e0e0; }
        thead { background-color: #333; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>🤖 XAUUSD Aggressive Bot</h3>
            <span id="last-update" class="badge bg-secondary">Waiting...</span>
        </div>

        <div class="row">
            <!-- Key Metrics -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="metric-label">Equity</div>
                        <div class="metric-value" id="equity">---</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="metric-label">Balance</div>
                        <div class="metric-value" id="balance">---</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="metric-label">Daily PnL</div>
                        <div class="metric-value" id="daily-pnl">---</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <div class="metric-label">Drawdown Limit</div>
                        <div class="metric-value text-danger" id="dd-limit">---</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">Active Positions</div>
                    <div class="card-body">
                        <table class="table table-dark table-striped">
                            <thead>
                                <tr>
                                    <th>Symbol</th>
                                    <th>Type</th>
                                    <th>Vol</th>
                                    <th>Open</th>
                                    <th>Current</th>
                                    <th>Profit</th>
                                </tr>
                            </thead>
                            <tbody id="positions-body">
                                <tr><td colspan="6" class="text-center">No Positions</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">Controls</div>
                    <div class="card-body">
                        <button class="btn btn-danger btn-stop" onclick="stopBot()">🛑 EMERGENCY STOP</button>
                        <hr>
                        <div class="metric-label">Active Signal</div>
                        <div id="active-signal" class="h5 mt-2">None</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateDashboard() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    if(data.error) return;

                    document.getElementById('last-update').innerText = data.last_update;
                    
                    document.getElementById('equity').innerText = '€' + data.account.equity.toFixed(2);
                    document.getElementById('balance').innerText = '€' + data.account.balance.toFixed(2);
                    
                    const pnl = data.risk.daily_pnl_pct;
                    const pnlEl = document.getElementById('daily-pnl');
                    pnlEl.innerText = (pnl * 100).toFixed(2) + '%';
                    pnlEl.className = 'metric-value ' + (pnl >= 0 ? 'text-success' : 'text-danger');

                    document.getElementById('dd-limit').innerText = (data.risk.daily_limit * 100).toFixed(1) + '%';
                    document.getElementById('active-signal').innerText = data.active_signal || 'None';

                    // Positions
                    const tbody = document.getElementById('positions-body');
                    tbody.innerHTML = '';
                    if (data.positions.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="text-center">No Positions</td></tr>';
                    } else {
                        data.positions.forEach(p => {
                            const row = `<tr>
                                <td>${p.symbol}</td>
                                <td class="${p.type === 'BUY' ? 'text-success' : 'text-danger'}">${p.type}</td>
                                <td>${p.volume}</td>
                                <td>${p.price_open}</td>
                                <td>${p.price_current}</td>
                                <td class="${p.profit >= 0 ? 'text-success' : 'text-danger'}">${p.profit.toFixed(2)}</td>
                            </tr>`;
                            tbody.innerHTML += row;
                        });
                    }
                });
        }

        function stopBot() {
            if(confirm("ARE YOU SURE YOU WANT TO STOP THE BOT?")) {
                fetch('/api/stop', {method: 'POST'})
                    .then(r => r.json())
                    .then(data => alert("STOP SIGNAL SENT!"));
            }
        }

        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>
</html>
