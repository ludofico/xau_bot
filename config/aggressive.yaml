account:
  initial_balance: 250
  currency: EUR
  leverage: 500
  broker_type: ECN

risk_management:
  # Position Sizing (Ultra-Aggressive for 100% Monthly)
  risk_per_trade_pct: 3.0          # Increased to 3%
  max_risk_per_trade_pct: 5.0      # Cap at 5%
  kelly_fraction: 0.5
  
  # Daily Limits
  max_daily_drawdown_pct: 10.0     # Wider drawdown allowance
  max_daily_profit_pct: 20.0       # Higher daily cap
  max_open_positions: 3
  max_trades_per_day: 10
  
  # Compounding
  compound_frequency: daily
  compound_after_profit_pct: 5.0

strategy:
  # Multi-Session Trading
  sessions:
    asian:
      enabled: true
      start: "00:00"
      end: "07:00"
      strategy: range_scalping
      max_trades: 2
      
    london:
      enabled: true
      start: "08:00"
      end: "12:00"
      strategy: breakout
      max_trades: 5                # Increased max trades
      
    ny:
      enabled: true
      start: "14:00"
      end: "18:00"
      strategy: momentum
      max_trades: 5                # Increased max trades

  # Entry Parameters
  entry:
    atr_period: 14
    atr_min_multiplier: 0.5
    roc_period: 5
    roc_threshold: 0.10            # Lower threshold for more frequency
    
  # Exit Parameters - HIGH R:R (1:2)
  # Essential for doubling account: Winners must pay for losers
  exit:
    sl_atr_multiplier: 1.2         # Tight SL
    tp_atr_multiplier: 2.4         # 1:2 Risk:Reward
    trailing_atr_multiplier: 0.8
    breakeven_after_rr: 1.0

costs:
  spread_usd: 0.20                 # Optimistic ECN spread
  slippage_usd: 0.10
  commission_per_lot: 7.0

ml_filter:
  enabled: true
  model_type: xgboost
  probability_threshold: 0.60      # Lower threshold to allow volume
  retrain_frequency: weekly

# Advanced Level 2 & 3 AI
